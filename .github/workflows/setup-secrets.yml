name: Setup Secrets Helper

on:
  workflow_dispatch:
    inputs:
      keystore_base64:
        description: 'KEYSTORE_BASE64 content'
        required: true
      keystore_pw:
        description: 'Keystore password'
        required: true
        default: 'jmreader2024'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Display Info
        run: |
          echo "Secrets需要手动配置"
          echo "请访问: https://github.com/${{ github.repository }}/settings/secrets/actions"
          echo ""
          echo "需要配置4个Secrets："
          echo "1. KEYSTORE_BASE64 - 从 keystore_base64.txt"
          echo "2. JM_KEYSTORE_PW - jmreader2024"
          echo "3. JM_KEY_PW - jmreader2024"
          echo "4. JM_KEY_ALIAS - jmreader"
